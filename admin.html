<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
BSR Admin Login
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#15b44a,#0d7d32);
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:white;
padding:40px 30px;
border-radius:35px;
text-align:center;
box-shadow:0 5px 25px rgba(0,0,0,0.2);
}

.logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:6px solid #15b44a;
}

.title{
font-size:45px;
font-weight:bold;
margin-top:20px;
color:#11152c;
}

.subtitle{
font-size:20px;
color:#777;
margin-top:10px;
}

.input-box{
margin-top:25px;
text-align:left;
}

.input-box label{
font-size:18px;
font-weight:bold;
color:#777;
}

.admin-input{
width:100%;
padding:18px;
border-radius:18px;
border:2px solid #e5e5e5;
margin-top:10px;
font-size:20px;
outline:none;
}

.login-btn{
width:100%;
padding:18px;
border:none;
background:#4f46e5;
color:white;
font-size:28px;
font-weight:bold;
border-radius:20px;
margin-top:30px;
cursor:pointer;
}

.login-btn:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<div class="title">
BSR Fish Stall
</div>

<div class="subtitle">
Admin & Staff Panel 🐟
</div>

<div class="input-box">

<label>
USER
</label>

<select id="userType" class="admin-input">

<option value="">
Select User
</option>

<option value="ADMIN">
ADMIN
</option>

<option value="HASHIM">
HASHIM
</option>

<option value="ATHUL">
ATHUL
</option>

<option value="VIJITH">
VIJITH
</option>

</select>

</div>

<div class="input-box">

<label>
NAME
</label>

<input
type="text"
id="username"
class="admin-input"
placeholder="Enter Name">

</div>

<div class="input-box">

<label>
PASSWORD
</label>

<input
type="password"
id="password"
class="admin-input"
placeholder="Enter Password">

</div>

<button
class="login-btn"
onclick="loginAdmin()">

Sign In

</button>

</div>

<script>

function loginAdmin(){

let user =
document.getElementById("userType").value;

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

if(
user=="ADMIN" &&
username=="ADMIN" &&
password=="admin123"
){

alert("ADMIN LOGIN SUCCESS");

window.location.href="index.html";

}

else if(
user=="HASHIM" &&
username=="HASHIM" &&
password=="hashim123"
){

alert("HASHIM LOGIN SUCCESS");

window.location.href="index.html";

}

else if(
user=="ATHUL" &&
username=="ATHUL" &&
password=="athul123"
){

alert("ATHUL LOGIN SUCCESS");

window.location.href="index.html";

}

else if(
user=="VIJITH" &&
username=="VIJITH" &&
password=="vijith123"
){

alert("VIJITH LOGIN SUCCESS");

window.location.href="index.html";

}

else{

alert("Wrong Username Or Password");

}

}

</script>

</body>
</html>

style="

">

Order Confirmed ✅

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyBy9ufRyJK9tYJB_pKTa8Sib6twt6wZAuQ",

authDomain: "bsr-fish-stall.firebaseapp.com",

databaseURL:
"https://bsr-fish-stall-default-rtdb.firebaseio.com/",

"bsr-fish-stall.firebasestorage.app",

messagingSenderId: "523597754559",

"1:523597754559:web:38ca537318fd8a893f960a",

measurementId: "G-NPTZC1NX3T"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

/* SAVE ORDER */

window.saveOrderToFirebase =
function(orderData){

push(
ref(db,"orders"),
orderData
);

};

</script>

<script>

/* CART */

let cart = [];
let deliveryCharge = 0;

/* PAGE */

function showPage(pageId){

document.getElementById("homePage").style.display="none";
document.getElementById("categoryPage").style.display="none";
document.getElementById("cartPage").style.display="none";
document.getElementById("accountPage").style.display="none";

document.getElementById(pageId).style.display="block";

}

/* SEARCH */

function searchFish(){

let input =
document.getElementById("searchInput")
.value.toLowerCase();

let items =
document.getElementsByClassName("fish-item");

for(let i=0;i<items.length;i++){

let fishName =
items[i]
.getElementsByTagName("h2")[0]
.innerText
.toLowerCase();

if(fishName.includes(input)){

items[i].style.display="block";

}else{

items[i].style.display="none";

}

}

}

/* PRICE */

function calculatePrice(rate,qtyId,unitId,totalId){

var qty =
document.getElementById(qtyId).value;

var unit =
document.getElementById(unitId).value;

if(qty==""){

document.getElementById(totalId)
.innerHTML="Total : ₹0";

return;

}

var total = 0;

if(unit=="KG"){

total = qty * rate;

}else{

total = (qty / 1000) * rate;

}

document.getElementById(totalId)
.innerHTML =
"Total : ₹" + total.toFixed(2);

}

/* STOCK */

function toggleStock(stockId){

let password =
prompt("Enter Admin Password");

if(password !== "bsr123"){

alert("Wrong Password");
return;

}

var stock =
document.getElementById(stockId);

if(stock.innerText=="In Stock"){

stock.innerText="Stock Out";

stock.classList.remove("in-stock");

stock.classList.add("out-stock");

}else{

stock.innerText="In Stock";

stock.classList.remove("out-stock");

stock.classList.add("in-stock");

}

}

/* ADD TO CART */

function addToCart(item,rate,qtyId,unitId,stockId){

var stock =
document.getElementById(stockId).innerText;

if(stock=="Stock Out"){

alert("Out Of Stock");
return;

}

var qty =
document.getElementById(qtyId).value;

var unit =
document.getElementById(unitId).value;

if(qty==""){

alert("Quantity enter ചെയ്യുക");
return;

}

var total = 0;

if(unit=="KG"){

total = qty * rate;

}else{

total = (qty / 1000) * rate;

}

cart.push({

item:item,
qty:qty,
unit:unit,
total:total

});

showCart();

showPage('cartPage');

alert("Cart ൽ Added ✅");

}

/* DELIVERY */

function updateDeliveryCharge(){

let location =
document.getElementById("customerLocation")
.value.toLowerCase();

if(location.includes("kunnicode")){

deliveryCharge = 20;

}

else if(location.includes("pathanapuram")){

deliveryCharge = 40;

}

else if(location.includes("punalur")){

deliveryCharge = 60;

}

else if(location.includes("anchal")){

deliveryCharge = 50;

}

else if(location.includes("ayoor")){

deliveryCharge = 70;

}

else{

deliveryCharge = 0;

}

document.getElementById("deliveryCharge")
.innerHTML = deliveryCharge;

showCart();

}

/* SHOW CART */

function showCart(){

let cartHTML = "";

let grandTotal = 0;

for(let i=0;i<cart.length;i++){

grandTotal += cart[i].total;

cartHTML += `

<div class="cart-item">

<h3>${cart[i].item}</h3>

<p>
⚖️ ${cart[i].qty} ${cart[i].unit}
</p>

<p>
💰 ₹${cart[i].total.toFixed(2)}
</p>

<button
onclick="deleteItem(${i})"
style="background:red;">
Delete
</button>

</div>

`;

}

if(cart.length==0){

cartHTML = "No items added";

}

let finalTotal =
grandTotal + deliveryCharge;

cartHTML += `

<div style="
margin-top:20px;
font-size:22px;
font-weight:bold;
color:#ff6b00;
">

🚚 Delivery Charge :
₹${deliveryCharge}

</div>

`;

document.getElementById("cartItems")
.innerHTML = cartHTML;

document.getElementById("grandTotal")
.innerHTML =
finalTotal.toFixed(2);

}

/* DELETE */

function deleteItem(index){

cart.splice(index,1);

showCart();

}

/* DELIVERY STATUS */

function updateDeliveryStatus(status){

document.getElementById("deliveryStatus")
.innerHTML = status;

}

/* WHATSAPP ORDER */

function sendWhatsAppOrder(){

var customerName =
document.getElementById("customerName")
.value;

var customerNumber =
document.getElementById("customerNumber")
.value;

var location =
document.getElementById("customerLocation")
.value;

if(customerName==""){

alert("Name enter ചെയ്യുക");
return;

}

if(customerNumber==""){

alert("Mobile Number enter ചെയ്യുക");
return;

}

if(location==""){

alert("Location enter ചെയ്യുക");
return;

}

if(cart.length==0){

alert("Cart Empty");
return;

}

/* ORDER ID */

let orderId =
"BSR" + Math.floor(Math.random() * 100000);

let message =
"*BSR Fish Order*%0A%0A";

message +=
"🆔 Order ID : " +
orderId + "%0A%0A";

message +=
"👤 Customer : " +
customerName + "%0A";

message +=
"📞 Mobile : " +
customerNumber + "%0A%0A";

let grandTotal = 0;

for(let i=0;i<cart.length;i++){

message +=
"🐟 Item : " + cart[i].item + "%0A" +
"⚖️ Quantity : " + cart[i].qty + " " + cart[i].unit + "%0A" +
"💰 Price : ₹" + cart[i].total.toFixed(2) + "%0A%0A";

grandTotal += cart[i].total;

}

/* DELIVERY */

message +=
"🚚 Delivery Charge : ₹" +
deliveryCharge + "%0A%0A";

let finalTotal =
grandTotal + deliveryCharge;

message +=
"🧾 Grand Total : ₹" +
finalTotal.toFixed(2) + "%0A%0A";

message +=
"📍 Location : " + location;

/* SAVE FIREBASE */

saveOrderToFirebase({

orderId: orderId,

customerName: customerName,

mobile: customerNumber,

location: location,

items: cart,

deliveryCharge: deliveryCharge,

total: finalTotal,

date: new Date().toLocaleString()

});

/* AUTO STATUS */

updateDeliveryStatus(
"🐟 Order Picked"
);

setTimeout(()=>{

updateDeliveryStatus(
"🚚 Delivery On The Way"
);

},5000);

setTimeout(()=>{

updateDeliveryStatus(
"✅ Delivered"
);

},10000);

/* WHATSAPP */

window.open(
"https://api.whatsapp.com/send?phone=918891416068&text=" + message,
"_blank"
);

}

/* AI CHAT */

function toggleChat(){

var chatBox =
document.getElementById("chatBox");

if(chatBox.style.display=="block"){

chatBox.style.display="none";

}else{

chatBox.style.display="block";

}

}

function sendMessage(){

var input =
document.getElementById("chatInput");

var message =
input.value.toLowerCase();

if(message=="") return;

var chatMessages =
document.getElementById("chatMessages");

chatMessages.innerHTML += `
<div class="user-message">
${input.value}
</div>
`;

let reply =
"മീൻ health benefits ചോദിക്കാം 🐟";

if(message.includes("അയല")){

reply =
"അയലയിൽ Omega-3 കൂടുതലാണ് ❤️";

}

else if(message.includes("മത്തി")){

reply =
"മത്തി കാൽസ്യം കൂടുതലുള്ള മത്സ്യമാണ് 🧠";

}

else if(message.includes("ചെമ്മീൻ")){

reply =
"ചെമ്മീൻ പ്രോട്ടീൻ കൂടുതലുള്ള മത്സ്യമാണ് 💪";

}

else if(message.includes("നെയ്മീൻ")){

reply =
"നെയ്മീൻ ആരോഗ്യത്തിന് നല്ലതാണ് 🛡️";

}

chatMessages.innerHTML += `
<div class="bot-message">
${reply}
</div>
`;

input.value="";

chatMessages.scrollTop =
chatMessages.scrollHeight;

}

</script>
